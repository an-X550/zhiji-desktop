<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知己 · 日志视觉样板</title>
<style>
:root{color-scheme:light;--bg:#f7f8f7;--paper:#fff;--ink:#262c29;--muted:#616b65;--line:#e2e7e3;--control:#86958b;--accent:#236c56;--accent-ink:#fff;--wash:#e6f0ea;--rail:#f0f3f1;--rail-ink:#56625a;--rail-active:#e0ece4;--focus:#327f66;--ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;--shadow:0 4px 24px rgba(28,48,37,.055)}
*{box-sizing:border-box}body{margin:0;font-family:var(--ui);font-size:14px;color:var(--ink);background:var(--bg);height:100dvh;overflow:hidden}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button,input,select,textarea{outline-offset:4px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus)}button{border:0;background:none}button:disabled{cursor:not-allowed;opacity:.48}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}::selection{background:#d7e9df;color:#1d4e3a}textarea{caret-color:var(--accent)}*{scrollbar-width:thin;scrollbar-color:#aab6ae transparent}
.demo-bar{height:40px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:16px;font-size:12px;color:var(--muted)}.demo-bar strong{font-weight:600;color:var(--ink)}.demo-controls{display:flex;gap:14px;align-items:center}.demo-controls button{color:var(--accent);padding:5px 0}.demo-controls button:hover{text-decoration:underline}.app{height:calc(100dvh - 40px);display:grid;grid-template-columns:188px minmax(0,1fr)}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:28px 14px 18px;min-height:0;overflow:auto}.brand{display:flex;align-items:center;gap:11px;margin:0 12px 42px;color:var(--ink);font-size:24px;font-weight:650;letter-spacing:.09em}.brand svg{width:24px;height:29px;stroke:#c2afe5;stroke-width:1.5}.nav{display:grid;gap:7px}.nav button,.rail-setting{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:11px 14px;border-radius:7px;color:inherit;font-size:14px}.nav button:hover,.rail-setting:hover{background:#e7ede9;color:#253c2e}.nav [aria-current=page]{background:var(--rail-active);color:#23573d}.nav [aria-current=page] svg{color:#34734f}.nav .nav-gap{margin-top:20px}.rail-bottom{margin-top:auto;padding-top:30px}.rail-note{margin:14px 14px 0;padding-top:17px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.rail-note svg{width:13px;height:13px}
.work{min-width:0;min-height:0;display:flex;flex-direction:column}.toolbar{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 34px;border-bottom:1px solid var(--line)}.toolbar-title{display:flex;gap:14px;align-items:center}.toolbar h1{font-size:16px;font-weight:600;margin:0}.toolbar-divider{height:16px;width:1px;background:var(--line)}.toolbar .location{font-size:12px;color:var(--muted)}.history-link{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;padding:8px 0}.history-link:hover{color:var(--accent)}.history-link svg{width:15px;height:15px}.stage{flex:1;min-height:0;overflow:auto;padding:28px 34px 26px;display:flex;flex-direction:column;align-items:center}.journal{width:100%;max-width:940px;min-height:480px;flex:1;display:flex;flex-direction:column;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);position:relative}.journal-head{padding:30px 44px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.date-heading{display:flex;align-items:baseline;gap:12px}.date-heading h2{margin:0;font-weight:500;font-size:30px;letter-spacing:-.025em;line-height:1.2;font-variant-numeric:tabular-nums}.date-heading span{font-size:13px;color:var(--muted)}.date-edit{position:relative;margin-top:10px;font-size:12px;color:var(--muted)}.date-edit summary{display:flex;align-items:center;gap:9px;list-style:none;cursor:pointer;width:fit-content;padding:3px 0}.date-edit summary::-webkit-details-marker{display:none}.date-edit summary:hover{color:var(--accent)}.date-edit summary svg{width:12px;height:12px;transform:rotate(90deg)}.date-popover{position:absolute;top:29px;left:0;z-index:5;display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-width:185px}.date-edit input{font-size:13px;border:1px solid var(--control);border-radius:6px;background:var(--paper);padding:7px 8px;color:var(--ink);width:100%}.date-edit input::-webkit-calendar-picker-indicator{opacity:.7;cursor:pointer}.draft-state{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:10px}.draft-state svg{width:14px;height:14px}.journal-tools{display:flex;align-items:center;gap:8px;padding:18px 44px 0}.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:5px 9px;color:var(--muted);background:var(--bg);border-radius:7px;font-size:12px}.chip svg{width:14px;height:14px}.chip select{max-width:140px;min-width:104px;border:0;background:transparent;font-size:12px;cursor:pointer;padding-right:2px}.chip:hover{color:var(--ink)}.template-menu{position:relative}.template-menu summary{list-style:none;cursor:pointer}.template-menu summary::-webkit-details-marker{display:none}.template-popover{position:absolute;top:38px;left:0;width:188px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);box-shadow:0 8px 24px #1c302518;z-index:4}.template-popover button{display:block;width:100%;text-align:left;padding:10px;border-radius:4px;font-size:13px}.template-popover button:hover{background:var(--wash);color:var(--accent)}.template-popover button+button{border-top:1px solid var(--line)}
.writing{padding:22px 44px 16px;flex:1;min-height:200px;display:flex;flex-direction:column}.writing textarea{width:100%;max-width:44em;flex:1;min-height:170px;resize:none;border:0;border-radius:0;padding:0;background:transparent;font-size:17px;line-height:1.75;letter-spacing:.01em;font-weight:400;color:var(--ink)}.writing textarea:focus-visible{outline:none}.writing:focus-within{box-shadow:inset 2px 0 var(--accent)}.writing textarea::placeholder{color:var(--muted);opacity:1}.writing-hint{margin:0 0 18px;font-size:12px;color:var(--muted);line-height:1.6}.writing-hint[hidden]{display:none}.composer-footer{margin:0 28px;padding:15px 0 18px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px;flex:none}.word-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.save-actions{display:flex;gap:10px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:8px;min-height:39px;padding:9px 15px;font-size:13px;font-weight:600;white-space:nowrap}.btn.primary{background:var(--accent);color:var(--accent-ink)}.btn.primary:hover:not(:disabled){background:#1a5644}.btn.secondary{color:var(--ink);background:var(--bg)}.btn.secondary:hover:not(:disabled){background:var(--line)}.btn svg{width:15px;height:15px}.context-note{width:100%;max-width:940px;display:flex;justify-content:space-between;gap:20px;flex:none;padding:15px 0 0;font-size:12px;color:var(--muted)}.context-note button{padding:0;color:var(--accent);font-size:12px}.context-note span{display:flex;align-items:center;gap:6px}.context-note svg{width:13px;height:13px}.notice{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:min(500px,90vw);padding:12px 18px;border-radius:8px;box-shadow:0 5px 25px #0002;background:var(--ink);color:var(--paper);font-size:13px;z-index:20}.notice[hidden]{display:none}.compare{position:fixed;inset:40px 0 0;background:var(--bg);z-index:10;overflow:auto;display:grid;place-items:center;padding:20px}.compare[hidden]{display:none}.compare img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--line)}
:root[data-theme=dark]{color-scheme:dark;--bg:#1d2220;--paper:#252c28;--ink:#eaf0ec;--muted:#b2bfb6;--line:#414e45;--control:#81978a;--accent:#94cfb1;--accent-ink:#1b3526;--wash:#304739;--rail:#202722;--rail-ink:#b7c7bd;--rail-active:#33483b;--focus:#a2d9bd;--shadow:none}:root[data-theme=dark] .btn.primary:hover:not(:disabled){background:#b4e2ca}:root[data-theme=dark] .nav button:hover,:root[data-theme=dark] .rail-setting:hover{background:#35463b}:root[data-theme=dark] .brand{color:var(--ink)}:root[data-theme=dark] .nav [aria-current=page]{color:#eaf0ec}:root[data-theme=dark] .nav [aria-current=page] svg{color:#94cfb1}:root[data-theme=dark] .date-edit input::-webkit-calendar-picker-indicator{opacity:1}
@media(min-width:1400px){.stage{padding:38px 60px 30px}.journal-head{padding-top:40px}.writing{padding-top:30px}.journal{max-width:940px}.journal-head,.journal-tools{padding-left:58px;padding-right:58px}.writing{padding-left:58px;padding-right:58px}.composer-footer{padding-left:30px}.writing textarea{font-size:18px}}
@media(max-width:1000px){.app{grid-template-columns:156px minmax(0,1fr)}.rail{padding:25px 10px 14px}.brand{margin:0 11px 30px;font-size:22px}.nav button,.rail-setting{padding:10px;gap:10px}.toolbar{padding:0 24px;height:54px}.stage{padding:20px 24px 18px}.journal{min-height:400px}.journal-head{padding:23px 28px 0}.journal-tools{padding:15px 28px 0}.date-heading h2{font-size:28px}.writing{padding:20px 28px 12px}.composer-footer{margin:0 28px;padding:12px 0 14px}.toolbar .location{display:none}.writing textarea{font-size:16px}.context-note{line-height:1.5}.context-note span{max-width:72%}}
@media(max-height:690px){.stage{padding-top:16px;padding-bottom:14px}.journal{min-height:0}.journal-head{padding-top:20px}.journal-tools{padding-top:10px}.writing{min-height:140px;padding-top:17px}.writing textarea{min-height:110px}.writing-hint{margin-bottom:12px}.context-note{padding-top:10px}.brand{margin-bottom:26px}.rail{padding-top:22px}}
@media(max-width:740px){.app{grid-template-columns:130px minmax(0,1fr)}.rail{padding-inline:6px}.brand{font-size:20px;gap:8px}.brand svg{width:19px}.nav button,.rail-setting{font-size:12px;gap:9px}.stage{padding:12px}.toolbar{padding:0 14px}.journal-head{padding-inline:20px}.journal-tools{padding-inline:20px;flex-wrap:wrap}.writing{padding-inline:20px}.composer-footer{margin:0 20px;padding:12px 0;flex-wrap:wrap}.draft-state{display:none}.date-heading{gap:7px}.date-heading h2{font-size:26px}.date-heading span{font-size:12px}.context-note{display:none}.demo-bar{padding-inline:12px}.demo-controls{gap:9px}.demo-description{display:none}.save-actions{margin-left:auto}.btn{padding:8px 10px;font-size:12px}.rail-note{margin-inline:10px}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color 140ms ease-out,color 140ms ease-out}}@media(max-height:470px){.stage{overflow:auto}.journal{min-height:370px}.rail{overflow:auto}.rail-bottom{padding-top:15px}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="book" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM9 3v18M13 7h3M13 11h3"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h14V9M10 21v-7h4v7"/></symbol>
<symbol id="pen" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-4-4L5 15l-1 5Z"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-9l-5 3v-3H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 9h10M7 13h6"/></symbol>
<symbol id="review" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM9 7h6M9 11h6M9 15h3"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v11H3V6ZM3 6V4h7l2 2h7v3"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="M5 4v16M12 4v16M19 4v16M2 8h6M9 15h6M16 9h6"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
</defs></svg>
<div class="demo-bar"><span><strong>视觉样板 · 浅色精修</strong><span class="demo-description"> · 合成示例，不写入日志、不调用 AI</span></span><div class="demo-controls"><button id="compare-toggle" aria-pressed="false">查看改前</button><button id="content-toggle">清空示例</button><button id="theme-toggle" aria-pressed="false">深色预览</button></div></div>
<div class="app">
<aside class="rail"><div class="brand">知己</div><nav class="nav" aria-label="主要导航"><button data-demo="开始页"><svg aria-hidden="true"><use href="#home"/></svg>开始</button><button aria-current="page"><svg aria-hidden="true"><use href="#pen"/></svg>日志</button><button data-demo="Agent 页"><svg aria-hidden="true"><use href="#chat"/></svg>知己 Agent</button><button class="nav-gap" data-demo="复盘页"><svg aria-hidden="true"><use href="#review"/></svg>复盘</button><button data-demo="项目页"><svg aria-hidden="true"><use href="#folder"/></svg>项目</button></nav><div class="rail-bottom"><button class="rail-setting" data-demo="设置页"><svg aria-hidden="true"><use href="#settings"/></svg>设置</button><div class="rail-note"><svg aria-hidden="true"><use href="#lock"/></svg>本地优先</div></div></aside>
<main class="work"><header class="toolbar"><div class="toolbar-title"><h1>日志</h1><span class="toolbar-divider" aria-hidden="true"></span><span class="location">留下一段真实经历</span></div><button class="history-link" data-demo="过去日志"><svg aria-hidden="true"><use href="#clock"/></svg>过去日志<svg aria-hidden="true"><use href="#chevron"/></svg></button></header>
<div class="stage"><section class="journal" aria-label="日志编辑器"><div class="journal-head"><div><div class="date-heading"><h2 id="date-title">9月8日</h2><span id="weekday">星期二</span></div><details class="date-edit"><summary><span id="date-year">2026年</span><span>更改日期</span><svg aria-hidden="true"><use href="#chevron"/></svg></summary><label class="date-popover">日志日期<input type="date" aria-label="日志日期" id="date" value="2026-09-08"></label></details></div><span class="draft-state"><svg aria-hidden="true"><use href="#pen"/></svg><span id="save-state">尚未保存</span></span></div>
<div class="journal-tools"><label class="chip"><svg aria-hidden="true"><use href="#folder"/></svg><select id="project" aria-label="关联项目"><option value="">不关联项目</option><option>毕业设计（示例）</option><option>求职准备（示例）</option></select></label><details class="template-menu"><summary class="chip"><svg aria-hidden="true"><use href="#review"/></svg>日志模板<svg style="width:12px;transform:rotate(90deg)" aria-hidden="true"><use href="#chevron"/></svg></summary><div class="template-popover"><button id="insert-template">经历 · 行动 · 结果</button><button data-demo="模板管理">管理模板</button></div></details></div>
<div class="writing"><p class="writing-hint" id="writing-hint" hidden>不必组织得很完整。先记下发生了什么。</p><textarea id="editor" aria-label="日志内容" spellcheck="false" placeholder="今天，有什么值得记下来？"></textarea></div>
<footer class="composer-footer"><span class="word-count" id="word-count">0 字</span><div class="save-actions"><button class="btn secondary" id="save-only">仅保存日志</button><button class="btn primary" id="generate">保存并生成反馈<svg aria-hidden="true"><use href="#arrow"/></svg></button></div></footer></section><div class="context-note"><span><svg aria-hidden="true"><use href="#lock"/></svg>生成反馈时，所选内容会发送给你配置的 AI 服务。</span><button id="ai-toggle" aria-pressed="true">模拟：AI 已配置</button></div></div>
</main></div>
<div class="compare" id="compare" hidden><img src="../ui-audit-2026-09-08/source-final/journal.png" alt="上一轮 v2.6.9 日志页视觉参考"/></div><div id="notice" class="notice" role="status" hidden></div>
<script>
const sample='今天把毕业设计的演示重新走了一遍。\n\n原本以为问题在功能不够多，真正讲起来才发现：最难的是让别人理解，我到底解决了什么问题。\n\n下午删掉了两页背景介绍，把最关键的使用过程放到了前面。这次同学很快就看懂了，也问出了更具体的问题。\n\n下次开始补功能之前，先把这段过程讲清楚。';
const $=id=>document.getElementById(id);let ai=true,timer;const editor=$('editor');editor.value=sample;
function sync(){const n=editor.value.trim().length;$('word-count').textContent=n+' 字';$('save-only').disabled=!n;$('generate').disabled=!n;$('save-state').textContent='尚未保存';$('writing-hint').hidden=Boolean(n);$('content-toggle').textContent=n?'清空示例':'填入示例'}
function note(text){$('notice').textContent=text;$('notice').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('notice').hidden=true,4200)}
editor.addEventListener('input',sync);$('content-toggle').onclick=()=>{if(editor.value&&editor.value!==sample&&!confirm('清空样板中输入的内容？内容不会写入本地日志。'))return;editor.value=editor.value?'':sample;sync()};
$('theme-toggle').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme-toggle').textContent=dark?'浅色预览':'深色预览';$('theme-toggle').setAttribute('aria-pressed',String(dark))};
function setCompare(open){$('compare').hidden=!open;document.querySelector('.app').inert=open;$('compare-toggle').textContent=open?'返回新样板':'查看改前';$('compare-toggle').setAttribute('aria-pressed',String(open));if(!open)$('compare-toggle').focus()}
$('compare-toggle').onclick=()=>setCompare($('compare').hidden);
$('save-only').onclick=()=>note('这是视觉样板：内容没有写入日志。正式版沿用现有保存流程。');$('generate').onclick=()=>note(ai?'这是视觉样板：没有调用 AI，也没有写入日志。':'这是视觉样板：正式版未配置 AI 时仅保存日志。');
$('ai-toggle').onclick=()=>{ai=!ai;$('ai-toggle').textContent=ai?'模拟：AI 已配置':'模拟：AI 未配置';$('ai-toggle').setAttribute('aria-pressed',String(ai));$('save-only').hidden=!ai;$('generate').firstChild.textContent=ai?'保存并生成反馈':'保存日志';note(ai?'已切换到已配置 AI 的视觉状态。':'已切换到未配置 AI 的视觉状态；本地写作仍可继续。')};
$('date').onchange=()=>{const value=$('date').value;if(!value)return;const d=new Date(value+'T12:00:00');$('date-title').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日';$('weekday').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(d);$('date-year').textContent=d.getFullYear()+'年';document.querySelector('.date-edit').open=false;document.querySelector('.date-edit summary').focus()};
document.querySelectorAll('.template-menu,.date-edit').forEach(menu=>menu.addEventListener('toggle',()=>{if(menu.open)document.querySelectorAll('.template-menu,.date-edit').forEach(other=>{if(other!==menu)other.open=false})}));
$('insert-template').onclick=()=>{if(editor.value&&!confirm('用模板替换样板中的内容？'))return;editor.value='发生了什么：\n\n我做了什么：\n\n结果怎样：\n';sync();document.querySelector('.template-menu').open=false;editor.focus()};
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>note('本样板仅演示日志页；'+b.dataset.demo+'由后续执行沿用真实功能。'));document.addEventListener('keydown',e=>{if(e.key==='Escape'){const template=document.querySelector('.template-menu'),dateMenu=document.querySelector('.date-edit');if(template.open){template.open=false;template.querySelector('summary').focus()}else if(dateMenu.open){dateMenu.open=false;dateMenu.querySelector('summary').focus()}if(!$('compare').hidden)setCompare(false)}});sync();
</script>
</body></html>
